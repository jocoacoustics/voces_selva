<style>
  :root {
    --bg1:#eef9f5;
    --bg2:#ffffff;
    --ring:rgba(11,107,88,.10);
    --shadow:0 18px 48px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    background:radial-gradient(circle at 50% 35%, #f8fdfa 0%, var(--bg1) 38%, var(--bg2) 100%);
    display:grid;
    place-items:center;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .stage{
    position:relative;
    width:min(42vw, 260px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:999px;
    background:radial-gradient(circle, rgba(11,107,88,.10) 0%, rgba(11,107,88,.04) 50%, rgba(11,107,88,0) 70%);
    transform:scale(.72);
    animation:ring 1.15s ease-out forwards;
    filter:blur(2px);
  }
  .logo{
    position:relative;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 16px 24px rgba(11,107,88,.16));
    transform:scale(.38);
    opacity:0;
    animation:logoEntrance 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes logoEntrance {
    0% { transform:scale(.38); opacity:0; }
    28% { opacity:1; }
    100% { transform:scale(1); opacity:1; }
  }
  @keyframes ring {
    0% { transform:scale(.55); opacity:0; }
    30% { opacity:1; }
    100% { transform:scale(1.18); opacity:.28; }
  }
</style>
